name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Pint & Pest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Ensure Laravel cache and storage directories exist
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Check PHP formatting with Laravel Pint
        run: ./vendor/bin/pint --test

      - name: Run Pest test suite
        run: php artisan test

  frontend:
    name: Frontend (TypeScript & Vite Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run lint

      - name: Run unit tests
        run: npx tsx --test resources/js/lib/starter-kit.test.ts

      - name: Build production assets
        run: npm run build
